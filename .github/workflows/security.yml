name: Security Scan
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/tray/package-lock.json

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip install -e ".[dev]"
          pip freeze > /tmp/requirements.txt
          pip-audit --requirement /tmp/requirements.txt --severity HIGH || echo "Vulnerabilities found (non-blocking)"

      - name: Node dependency audit
        working-directory: ui/tray
        run: npm audit --audit-level=high || echo "Vulnerabilities found (non-blocking)"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          if [ -f .secrets.baseline ]; then
            detect-secrets audit --baseline .secrets.baseline
          else
            detect-secrets scan --baseline .secrets.baseline || true
          fi

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
