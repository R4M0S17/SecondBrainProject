name: Security Scan
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/tray/package-lock.json

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip install -e ".[dev]"
          pip freeze > /tmp/requirements.txt
          pip-audit --requirement /tmp/requirements.txt --severity HIGH || echo "Vulnerabilities found (non-blocking)"

      - name: Node dependency audit
        working-directory: ui/tray
        run: npm audit --audit-level=high || echo "Vulnerabilities found (non-blocking)"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for new secrets
        run: |
          detect-secrets scan \
            --exclude-files 'tests/|docs/|\.venv/|node_modules/|\.secrets\.baseline' \
            > /tmp/current_scan.json

          python3 - /tmp/current_scan.json .secrets.baseline << 'PYEOF'
import json, sys

scan_file, baseline_file = sys.argv[1], sys.argv[2]

with open(scan_file) as f:
    current = json.load(f)
with open(baseline_file) as f:
    baseline = json.load(f)

# Build set of already-reviewed findings (marked false positive)
reviewed = {
    (fname, s["line_number"], s["type"])
    for fname, findings in baseline.get("results", {}).items()
    for s in findings
    if s.get("is_secret") is False
}

# Any finding not in the reviewed set is new / unaudited
new_findings = [
    f"  {s['type']} @ {fname}:{s['line_number']}"
    for fname, findings in current.get("results", {}).items()
    for s in findings
    if (fname, s["line_number"], s["type"]) not in reviewed
]

if new_findings:
    print("New unaudited findings — add to .secrets.baseline or mark false positive:")
    print("\n".join(new_findings))
    sys.exit(1)

total = sum(len(v) for v in current.get("results", {}).values())
print(f"OK — {total} known findings in baseline, none new.")
PYEOF

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
