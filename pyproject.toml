[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebro"
version = "0.1.0"
description = "Cerebro Digital Local — Agentic Personal OS"
requires-python = ">=3.11"
dependencies = [
    # Inference / LLM
    "httpx>=0.27",
    "anthropic>=0.40.0",
    # Env file loading
    "python-dotenv>=1.0",
    # Vector DB
    "lancedb>=0.8",
    # Document parsing
    "pymupdf>=1.24",
    "python-docx>=1.1",
    # Agent framework
    "langgraph>=0.1",
    "langchain-core>=0.2",
    # File watcher
    "watchdog>=4.0",
    # Sandbox
    "RestrictedPython>=7.0",
    # Config
    "tomli>=2.0; python_version < '3.11'",
    # Logging
    "loguru>=0.7",
    # RAM monitoring (ProviderRegistry auto-selection)
    "psutil>=5.9",
    # Scheduler
    "apscheduler>=3.10",
    # Calendar
    "icalendar>=5.0",
    "dateparser>=1.1",
    # REST API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Testing
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
]
mlx = [
    "mlx>=0.16",
    "mlx-lm>=0.19",
]
dev = [
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest-cov>=5.0",
]
build = [
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "scheduler*", "integrations*", "config*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Imports must follow load_dotenv() so env is visible to the rest of the module.
"main.py" = ["E402"]
"cerebro/main.py" = ["E402"]
# Late imports after local stubs / section headers (test structure).
"tests/test_agent_runtime.py" = ["E402"]
"tests/test_calendar.py" = ["E402"]
"tests/test_mlx_provider.py" = ["E402"]
"tests/test_tools.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
