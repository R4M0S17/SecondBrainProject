[general]
app_name = "Cerebro"
language = "es"
log_level = "INFO"

[providers]
default_chat = "Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
fallback_chat = "mlx-community/Phi-4-mini-instruct-3bit"
embedding = "v5-nano-retrieval-Q4_K_M.gguf"
base_url = "http://127.0.0.1:8080"

[providers.selection]
ram_threshold_primary_gb = 1.0
ram_threshold_fallback_gb = 0.3

[inference]
model = "Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
embedding_model = "v5-nano-retrieval-Q4_K_M.gguf"
base_url = "http://127.0.0.1:8080"
timeout_seconds = 30
context_window = 4096

[ingestion]
watched_paths = []
chunk_size = 768
chunk_overlap = 96
min_chunk_size = 50
excluded_patterns = [".git", "node_modules", "__pycache__", ".venv"]

[memory]
db_path = "~/.cerebro/db"
agent_state_dir = "~/.cerebro/agents"
short_term_max_messages = 30
long_term_episode_limit = 500

[tools]
enable_execute_python = true
enable_write_file = true
authorized_write_paths = []

[files]
cerebro_files_path = "~/Desktop/CerebroFiles"
authorized_read_paths = ["~/Desktop/Javier/SecondBrain", "~/Desktop/CerebroFiles"]
authorized_write_paths = ["~/Desktop/CerebroFiles"]

[ui]
hotkey = "cmd+shift+space"
port = 7842

[scheduler]
enabled = true
check_interval_minutes = 5
do_not_disturb = false

[calendar]
ics_path = ""
use_apple_calendar = false

[security]
max_file_size_mb = 50
sandbox_timeout_seconds = 10
sandbox_memory_mb = 64

[mlx]
enabled = "auto"
chat_model = "mlx-community/Phi-4-mini-instruct-3bit"
max_tokens = 2048
